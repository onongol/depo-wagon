name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The test database needs pgvector and infra/init.sql, which creates the
      # extension in template1 so pytest's test_test_db inherits it. A plain
      # postgres service container cannot run that, so reuse the compose file.
      - name: Start the test database
        run: docker compose -f docker-compose.test.yml up -d --wait db_test

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Settings come from pytest.ini; every setting base.py reads has a
      # default, so no .env is needed here.
      - name: Run tests
        run: pytest -q

      - name: Database logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs db_test
