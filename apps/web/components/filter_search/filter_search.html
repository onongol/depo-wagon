<div class="relative">
  <input
    type="text"
    name="{{ name }}"
    value="{{ value }}"
    placeholder="{{ placeholder }}"
    hx-get="{{ url }}"
    hx-target="{{ target }}"
    hx-trigger="input changed delay:400ms"
    hx-push-url="true"
    hx-include="closest form"
    class="block w-full rounded-xl border border-gray-300 bg-gray-100 py-2 pr-4 pl-4 text-sm text-gray-700 placeholder-gray-400 transition focus:border-gray-400 focus:ring-2 focus:ring-gray-400 focus:outline-none sm:w-48 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:placeholder-gray-500"
  />
</div>
