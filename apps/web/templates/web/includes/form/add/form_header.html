{% load i18n %}
<div class="mb-6 flex items-center gap-3">
    <a href="{{ back_url }}"
       class="text-gray-400 transition hover:text-gray-600 dark:hover:text-gray-300"
       aria-label="{% trans 'Back' %}">
        <svg class="size-5" aria-hidden="true">
            <use href="#chevron-left"></use>
        </svg>
    </a>
    <h1 class="text-xl font-semibold text-gray-800 dark:text-gray-200">{{ title|default:_("Add") }}</h1>
</div>
