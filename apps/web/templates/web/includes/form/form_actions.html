{% load i18n %}
<div class="mt-4 flex justify-end gap-3">
    <a href="{{ cancel_url }}"
       class="rounded-xl border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-600 transition hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400">
        {% trans "Cancel" %}
    </a>
    <button type="submit"
            class="cursor-pointer rounded-xl bg-blue-500 px-5 py-2 text-sm font-medium text-white transition hover:bg-blue-700 focus:ring-2 focus:ring-blue-300 focus:outline-none">
        {{ submit_label|default:_("Save") }}
    </button>
</div>
