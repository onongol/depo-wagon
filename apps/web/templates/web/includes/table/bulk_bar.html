{% load i18n %}
<div
  x-show="selected.length > 0"
  x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 translate-y-2"
  class="fixed bottom-6 left-1/2 z-30 flex -translate-x-1/2 items-center gap-4 rounded-full bg-gray-900/80 py-2.5 pr-2.5 pl-5 shadow-lg backdrop-blur-sm dark:bg-gray-800/80"
>
  <span class="text-sm font-medium text-white"> <span x-text="selected.length"></span> {% trans "selected" %} </span>
  <button
    type="button"
    @click="deleteModalOpen = true"
    class="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1.5 text-sm font-medium text-red-400 transition hover:bg-white/20"
  >
    <svg class="size-4" aria-hidden="true">
      <use href="#delete"></use>
    </svg>
    {% trans "Delete" %}
  </button>
</div>
