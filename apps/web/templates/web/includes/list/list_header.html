{% load i18n %}
<div class="mb-6 flex items-center justify-between gap-4">
    <div>
        <h1 class="text-xl font-semibold text-gray-800 dark:text-gray-200">{{ title }}</h1>
        {% if subtitle %}
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ subtitle }}</p>
        {% endif %}
    </div>
    {% if add_url %}
        <a href="{{ add_url }}"
           class="hidden items-center gap-2 rounded-3xl bg-blue-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-500 focus:ring-2 focus:ring-blue-700 focus:outline-none md:inline-flex">
            <svg class="size-4" aria-hidden="true">
                <use href="#plus"></use>
            </svg>
            {% trans "Add" %}
        </a>
        <a href="{{ add_url }}"
           class="fixed right-6 bottom-6 z-40 inline-flex h-14 w-14 items-center justify-center rounded-full bg-blue-500 text-white shadow-lg transition hover:bg-blue-700 focus:ring-2 focus:ring-blue-300 focus:outline-none md:hidden"
           aria-label="{% trans 'Add' %}">
            <svg class="size-6" aria-hidden="true">
                <use href="#plus"></use>
            </svg>
        </a>
    {% endif %}
</div>
