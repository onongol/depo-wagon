{% load i18n %}
<div
  x-data="{ show: true }"
  x-show="show"
  class="relative flex w-full items-start rounded-md bg-yellow-50 p-4 text-yellow-800 shadow-sm dark:bg-yellow-500/20 dark:text-yellow-400"
  role="alert"
  aria-live="polite"
>
  <div class="pr-6 text-sm">
    <strong class="font-semibold">{% trans "Warning" %}!</strong>
    <p>{{ message }}</p>
  </div>
  <button
    type="button"
    @click="show = false"
    class="absolute top-2 right-2 cursor-pointer rounded p-1 transition hover:bg-yellow-100 focus:ring-2 focus:ring-yellow-400 focus:outline-none dark:hover:bg-yellow-200/10"
    aria-label="{% trans 'Close' %}"
  >
    <svg class="size-4" aria-hidden="true"><use href="#close"></use></svg>
  </button>
</div>
