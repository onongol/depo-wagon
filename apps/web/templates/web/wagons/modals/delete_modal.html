{% load i18n %}
<div x-show="deleteModalOpen"
     x-cloak
     @keydown.escape.window="deleteModalOpen = false"
     class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
         @click="deleteModalOpen = false"></div>
    <div class="relative z-10 w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl dark:bg-gray-900">
        <h2 class="text-base font-semibold text-gray-800 dark:text-gray-200">{% trans "Delete Wagons" %}</h2>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
            {% trans "Delete" %} <span class="font-medium text-gray-700 dark:text-gray-300" x-text="selected.length"></span> {% trans "wagon(s)? This action cannot be undone." %}
        </p>
        <form method="post" action="{% url 'web:wagon_delete_bulk' %}">
            {% csrf_token %}
            <template x-for="id in selected" :key="id">
                <input type="hidden" name="ids" :value="id">
            </template>
            <div class="mt-5 flex justify-end gap-3">
                <button type="button"
                        @click="deleteModalOpen = false"
                        class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
                    {% trans "Cancel" %}
                </button>
                <button type="submit"
                        class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700">
                    {% trans "Delete" %}
                </button>
            </div>
        </form>
    </div>
</div>
