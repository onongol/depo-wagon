{% load i18n %}
<div class="flex items-center gap-1">
    <!-- Theme toggle -->
    <button type="button"
            data-theme-toggle
            class="inline-flex cursor-pointer items-center justify-center rounded-md p-2 text-gray-500 transition hover:bg-gray-100 hover:text-gray-700 focus:ring-2 focus:ring-gray-400 focus:outline-none dark:text-gray-400 dark:hover:bg-gray-700"
            aria-label="{% trans 'Toggle theme' %}">
        <svg class="size-5 dark:hidden" aria-hidden="true">
            <use href="#sun-fill"></use>
        </svg>
        <svg class="hidden size-5 dark:block" aria-hidden="true">
            <use href="#moon-stars-fill"></use>
        </svg>
    </button>
    <!-- User info + logout -->
    {% if request.user.is_authenticated %}
        <div class="flex items-center gap-2">
            <span class="hidden text-sm text-gray-600 sm:block dark:text-gray-400">{{ request.user.email }}</span>
            <a href="{% url 'web:logout' %}"
               class="inline-flex cursor-pointer items-center justify-center rounded-md p-2 text-gray-500 transition hover:bg-gray-100 hover:text-gray-700 focus:ring-2 focus:ring-gray-400 focus:outline-none dark:text-gray-400 dark:hover:bg-gray-700"
               aria-label="{% trans 'Sign out' %}">
                <svg class="size-5" aria-hidden="true">
                    <use href="#signout"></use>
                </svg>
            </a>
        </div>
    {% endif %}
</div>
