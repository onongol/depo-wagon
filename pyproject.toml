[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["*/migrations/*", "static/*", "staticfiles/*"]

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "BLE", "C4", "C90", "COM", "DJ", "DTZ", "E", "EM",
  "ERA", "EXE", "F", "FA", "FBT", "FLY", "G", "I", "ICN", "INP", "INT",
  "ISC", "LOG", "N", "PD", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI",
  "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TC",
  "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
  # Django and DRF read mutable class attributes as configuration:
  # list_display, fields, allowed_roles and the like. ClassVar would be wrong
  # about 98 times here.
  "RUF012",
  "COM812",  # missing-trailing-comma — Ruff warns about this one on every run
  "COM819",  # prohibited-trailing-comma
  "ISC001",  # single-line-implicit-string-concatenation
  "ISC002",  # multi-line-implicit-string-concatenation
  "Q000", "Q001", "Q002", "Q003", "Q004",  # quote style
  "W191",  # tab-indentation
  "RUF001",  # String contains ambiguous unicode character
  "RUF002",  # Docstring contains ambiguous unicode character
  "RUF003",  # Comment contains ambiguous unicode character

  # --- Pre-existing debt. What is left is the one line that never had a
  # mechanical fix: every import has to be classified as breaking a real
  # cycle or as having ended up there by accident. Counts measured, not
  # inherited.
  "PLC0415",  # 53 in application code, 127 in tests — imports inside functions
]

[tool.ruff.lint.pycodestyle]
# Wider than line-length: the formatter cannot split string content.
max-line-length = 100

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations when the class is built, so an import
# hidden in a TYPE_CHECKING block leaves the model incomplete — it imports
# fine and raises PydanticUserError at first use.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Settings modules are assembled with star imports.
"config/settings/*.py" = ["F403", "F405"]
# Decisions, not debt. In an assertion the literal is the documentation, and
# naming it hides what is checked. Test credentials are fixtures. pytest.raises
# on a broad exception is the point of the test in these cases.
"**/tests/*.py" = [
  "B011", "B017", "DTZ011", "N806", "PLC1901", "PLR2004", "PT011", "PT015",
  "PT018", "PT022", "RET504", "RUF059", "S101", "S105", "S106", "SIM117",
  "UP017", "UP041",
]
"conftest.py" = ["S105", "S106"]
# django-components discovers component directories by path, not by import, so
# they deliberately have no __init__.py.
"apps/web/components/*" = ["INP001"]

[tool.djlint]
profile = "django"
extension = "html"
# django-components' tags are block tags; without this djlint reports every
# {% endcomponent %}/{% endslot %}/{% endfill %} as an unmatched end tag.
custom_blocks = "component,slot,fill"
# H021 (inline styles): the one hit is the <svg> sprite sheet, where the
# attributes are the graphic. H030/H031 (meta description/keywords): this is a
# logged-in depot tool, not an indexed page.
ignore = "H021,H030,H031"
