exclude: '/migrations/|^static/|^staticfiles/|^\.venv/|package-lock\.json'
default_stages: [pre-commit]
default_language_version:
  python: python3.14
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Prettier is the only formatter for templates: it and djlint --reformat
  # rewrite each other's output forever, so djLint below only lints.
  # Runs from node_modules rather than an isolated env: Prettier resolves the
  # plugins named in .prettierrc against the working directory, so an isolated
  # copy cannot find them. Requires `npm ci` first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: \.(html|css|ts|js)$

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.32.0
    hooks:
      - id: django-upgrade
        args: ["--target-version", "5.2"]

  # rev must match the ruff pin in requirements-dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Lint only - formatting belongs to Prettier. rev must match requirements-dev.txt.
  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      - id: djlint-django

  # tsc checks the whole project at once, so it runs on push rather than per commit.
  - repo: local
    hooks:
      - id: typecheck
        name: tsc --noEmit
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: \.ts$
        stages: [pre-push]

ci:
  autoupdate_schedule: weekly
